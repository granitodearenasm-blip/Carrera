# Compila la página en cada push a main y publica el resultado (dist/) en la rama "sitio".
# Wasmer debe desplegar la rama "sitio": ahí está el sitio listo, con index.html en la raíz.
# No edites la rama "sitio" a mano: se reemplaza completa en cada publicación.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-sitio
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir dist/ a la rama sitio
        working-directory: dist
        run: |
          git init -q -b sitio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sitio generado desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sitio
